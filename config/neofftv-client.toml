[hud]
	# Pokazuje boczny HUD mocy moba (Z/X/C ability slots).
	showMobPowerHud = true
	#Allowed Values: RIGHT_RAIL, ABOVE_HOTBAR, TOP_LEFT, TOP_RIGHT, BOTTOM_LEFT, BOTTOM_RIGHT
	hudAnchor = "RIGHT_RAIL"
	# Default: 0
	# Range: -500 ~ 500
	hudXOffset = 0
	# Default: 0
	# Range: -500 ~ 500
	hudYOffset = 0
	# Default: 1.0
	# Range: 0.5 ~ 2.0
	hudScale = 1.0
	showCooldownNumbers = true
	showReadyLabel = true
	# Pack default: true — mniej screen real estate na co dzień.
	compactHud = true
	# Pack default: false — tooltipy ability cards rozpraszają w daily play.
	showAbilityTooltips = false

[rendering]
	enableWorldDisguiseRender = true
	# Pack default: false — pierwszoosobowe odnóża (creeper/mob) są efektowne
	# w nagraniu ale na co dzień rozpraszają. K-menu → włącz dla cinematic.
	enableFirstPersonAppendages = false
	# Default: 1.0
	# Range: 0.5 ~ 2.0
	appendageScale = 1.0
	# Default: 1.0
	# Range: 0.5 ~ 2.0
	appendageXSpread = 1.0
	# Default: 0.0
	# Range: -1.0 ~ 1.0
	appendageYOffset = 0.0
	# Default: 0.0
	# Range: -1.0 ~ 1.0
	appendageZOffset = 0.0
	# Default: 1.0
	# Range: 0.5 ~ 2.0
	humanoidLayoutMultiplier = 1.0
	# Default: 1.0
	# Range: 0.5 ~ 2.0
	quadrupedLayoutMultiplier = 1.0
	# Default: 1.0
	# Range: 0.5 ~ 2.0
	multiLegLayoutMultiplier = 1.0
	# Pack default: false — markery slime nad re-przyczepionymi głowami =
	# debug-uful, codzienność = szum.
	showHeadReattachmentSlimeMarker = false
	# Pack default: false — ciągłe partykuły śluzu, duży FPS hit + spam.
	headReattachmentSlimeParticles = false
	# Pack default: true — odpięte głowy hybrydowe to kluczowy mech-feed.
	showHybridAttachedHeads = true
	# Pack default: false — pierścień świeżego kleju krótko, niech znika.
	showFreshHeadGlueRing = false
	# Pack default: false — najcięższy partykuł-spam (tick co frame dla
	# każdej hybrydy w zasięgu).
	hybridHeadParticles = false

[tacticalmap]
	# Pack default: false — cinematic kamera (40-tick dummy ArmorStand +
	# zoom-on-target) jest wyjątkowo "too much" na co dzień. Operator może
	# włączyć dla nagrań w tactical map.
	enableCinematicStrikes = false

[magicVision]
	# Sam shader-magic-vision dostępny; magicVisionEnabledByDefault=false
	# → overlay nie wisi w tle dopóki nie naciśniesz V.
	enableVeilEffects = true
	magicVisionEnabledByDefault = false
	#Allowed Values: LOW, MEDIUM, HIGH
	# Pack default: LOW — lekki render gdy V włączone.
	magicVisionQuality = "LOW"
	# Default: 96
	# Range: 16 ~ 256
	# Pack default: 48 — twardszy cap = oszczędność CPU przy zerg-army.
	magicVisionMaxTrackedEntities = 48
	# Default: 36
	# Range: 4 ~ 160
	magicVisionMaxTrailPoints = 36
	# Pack default: false — army tactical overlay (linki, vector lines do
	# celów) jest piękny w cinematic ale rozprasza na co dzień. M = mapa
	# ma pełen widok.
	enableArmyTacticalOverlay = false
	# Default: 96
	# Range: 8 ~ 512
	armyOverlayMaxMembers = 96
	# Default: 64
	# Range: 0 ~ 512
	armyOverlayMaxLinks = 64

[camera]
	# Default: 1.0
	# Range: 0.1 ~ 4.0
	cameraWiggleSpeed = 1.0
	# Default: 1.0
	# Range: 0.0 ~ 3.0
	cameraWigglePitch = 1.0
	# Default: 0.45
	# Range: 0.0 ~ 3.0
	cameraWiggleYaw = 0.45
	# Default: 0.25
	# Range: 0.0 ~ 3.0
	cameraWiggleRoll = 0.25
	# Default: 1.35
	# Range: 0.25 ~ 4.0
	cameraWiggleSprintMultiplier = 1.35
	#Allowed Values: OFF, WIGGLE, HANDHELD
	# Pack default: OFF — kamera handheld jest motion-sickness-friendly
	# tylko podczas nagrania. Daily play = OFF; J keybind toggle_handheld
	# przełącza gdy chcesz cinematic.
	cameraWiggleMode = "OFF"
	# Default: 0.0
	# Range: 0.0 ~ 3.0
	cameraWiggleWalkIntensity = 0.95
	# Default: 0.0
	# Range: 0.0 ~ 3.0
	cameraWiggleIdleIntensity = 1.5
